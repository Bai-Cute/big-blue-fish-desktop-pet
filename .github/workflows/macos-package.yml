name: macOS package
on:
  push:
    branches: [build/macos-1.1.3]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft Release tag to receive the verified packages; empty builds only
        required: false
        default: ''
permissions:
  contents: read
jobs:
  package:
    if: github.repository == 'Bai-Cute/big-blue-fish-desktop-pet'
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        edition: [Standard, Safe]
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && 'v1.1.3' || inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Build self-contained application
        run: |
          test "$(uname -m)" = arm64
          bash tools/build-macos.sh '${{ matrix.edition }}' "$RUNNER_TEMP/app-output"
      - name: Verify application and package DMG
        env:
          EDITION: ${{ matrix.edition }}
        run: |
          title=蓝色大肥鱼; suffix=''
          if [[ $EDITION == Safe ]]; then title=蓝色大肥鱼无MCP版; suffix=-Safe; fi
          app="$RUNNER_TEMP/app-output/$title.app"
          python3 tools/Verify-MacPackage.py "$app" --edition "$EDITION" --output "$RUNNER_TEMP/verification"
          stage=$(mktemp -d "$RUNNER_TEMP/dmg-stage.XXXXXXXX")
          ditto "$app" "$stage/$title.app"
          ln -s /Applications "$stage/Applications"
          name="BigBlueFish-v1.1.3${suffix}-macOS-arm64.dmg"
          mkdir -p "$RUNNER_TEMP/packages"
          hdiutil create -volname 'BigBlueFish' -srcfolder "$stage" -format UDZO "$RUNNER_TEMP/packages/$name"
          hdiutil verify "$RUNNER_TEMP/packages/$name"
          (cd "$RUNNER_TEMP/packages"; shasum -a 256 "$name" > "$name.sha256")
          python3 - "$RUNNER_TEMP/packages/$name" "$RUNNER_TEMP/verification/package.json" <<'PY'
          import hashlib,json,pathlib,sys
          p=pathlib.Path(sys.argv[1])
          with p.open('rb') as f: digest=hashlib.file_digest(f,'sha256').hexdigest()
          pathlib.Path(sys.argv[2]).write_text(json.dumps(dict(name=p.name,bytes=p.stat().st_size,sha256=digest),indent=2))
          PY
      - name: Upload verified packages to draft Release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/packages/"* --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macOS-${{ matrix.edition }}-verification
          path: ${{ runner.temp }}/verification
          if-no-files-found: ignore
